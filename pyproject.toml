[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotomy-ai"
version = "0.1.0"
description = "Observable, transferable player experience scaffold for Lobotomy Corporation"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
robotomy = "robotomy.cli:main"

[tool.setuptools.packages.find]
include = ["robotomy*"]
